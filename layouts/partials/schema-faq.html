{{/*
  FAQ Schema Markup
  Usage: {{ partial "schema-faq.html" . }}

  Add FAQs in front matter:
  faqs:
    - question: "What is X?"
      answer: "X is..."
*/}}
{{ if .IsPage }}
{{ with .Params.faqs }}
{{ if gt (len .) 0 }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {{ range $i, $faq := . }}{{ if $i }},{{ end }}
    {
      "@type": "Question",
      "name": {{ $faq.question | jsonify }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ $faq.answer | jsonify }}
      }
    }
    {{ end }}
  ]
}
</script>
{{ end }}
{{ end }}
{{ end }}
