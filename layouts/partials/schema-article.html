{{/*
  Article Schema Markup
  Usage: {{ partial "schema-article.html" . }}
*/}}
{{ if .IsPage }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ .Title | jsonify }},
  "description": {{ .Description | default .Summary | truncate 160 | jsonify }},
  "image": {{ if .Params.image }}{{ .Params.image | absURL | jsonify }}{{ else }}"https://aitoolsdaily.org/images/og-default.jpg"{{ end }},
  "author": {
    "@type": "Organization",
    "name": "AI Tools Daily",
    "url": "https://aitoolsdaily.org"
  },
  "publisher": {
    "@type": "Organization",
    "name": "AI Tools Daily",
    "logo": {
      "@type": "ImageObject",
      "url": "https://aitoolsdaily.org/favicon.svg"
    }
  },
  "datePublished": {{ .Date.Format "2006-01-02T15:04:05Z07:00" | jsonify }},
  "dateModified": {{ (or .Params.updated .Date).Format "2006-01-02T15:04:05Z07:00" | jsonify }},
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": {{ .Permalink | jsonify }}
  }
  {{ with .Params.tags }},
  "keywords": {{ delimit . ", " | jsonify }}
  {{ end }}
}
</script>
{{ end }}
