{{/* Google AdSense - Add your publisher ID to config.toml */}}
{{ with .Site.Params.adsensePublisher }}
<!-- Google AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ . }}" crossorigin="anonymous"></script>
{{ end }}

{{/* Ad unit placeholder - replace data-ad-slot with your actual ad slots */}}
{{ define "ad-unit" }}
{{ with $.Site.Params.adsensePublisher }}
<div class="ad-container" style="margin: var(--space-6) 0; text-align: center;">
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="{{ . }}"
       data-ad-slot="{{ $.Params.slot | default "1234567890" }}"
       data-ad-format="{{ $.Params.format | default "auto" }}"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>
{{ end }}
{{ end }}
