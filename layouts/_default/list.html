{{ define "main" }}
<h1>{{ .Title }}</h1>

{{ if .Content }}
<div style="margin-bottom: 30px;">
    {{ .Content }}
</div>
{{ end }}

<ul class="post-list">
{{ range .Pages }}
    <li>
        <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
        <p class="meta">{{ .Date.Format "January 2, 2006" }}</p>
        <p class="excerpt">{{ .Summary | truncate 160 }}</p>
    </li>
{{ end }}
</ul>
{{ end }}
