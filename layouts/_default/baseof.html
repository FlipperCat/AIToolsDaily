<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <link rel="canonical" href="{{ .Permalink }}">

    <!-- Open Graph -->
    <meta property="og:title" content="{{ .Title }}">
    <meta property="og:description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
    <meta property="og:url" content="{{ .Permalink }}">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --text: #1f2937;
            --text-light: #6b7280;
            --bg: #ffffff;
            --bg-alt: #f9fafb;
            --border: #e5e7eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            color: var(--text);
            line-height: 1.7;
            background: var(--bg);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            border-bottom: 1px solid var(--border);
            padding: 20px 0;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            margin-right: 20px;
            font-size: 0.95rem;
        }

        nav a:hover {
            color: var(--primary);
        }

        article {
            margin-bottom: 60px;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        h2 {
            font-size: 1.6rem;
            margin: 40px 0 20px;
        }

        h3 {
            font-size: 1.3rem;
            margin: 30px 0 15px;
        }

        p {
            margin-bottom: 20px;
        }

        a {
            color: var(--primary);
        }

        .meta {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .post-list {
            list-style: none;
        }

        .post-list li {
            padding: 25px 0;
            border-bottom: 1px solid var(--border);
        }

        .post-list h2 {
            font-size: 1.4rem;
            margin: 0 0 10px;
        }

        .post-list h2 a {
            color: var(--text);
            text-decoration: none;
        }

        .post-list h2 a:hover {
            color: var(--primary);
        }

        .post-list .excerpt {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .cta-box {
            background: var(--bg-alt);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 25px;
            margin: 30px 0;
        }

        .cta-box h4 {
            margin-bottom: 10px;
        }

        .btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            margin-top: 10px;
        }

        .btn:hover {
            background: var(--primary-dark);
            color: white;
        }

        ul, ol {
            margin: 0 0 20px 25px;
        }

        li {
            margin-bottom: 8px;
        }

        code {
            background: var(--bg-alt);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        pre {
            background: #1f2937;
            color: #e5e7eb;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 20px 0;
        }

        pre code {
            background: none;
            padding: 0;
        }

        blockquote {
            border-left: 4px solid var(--primary);
            padding-left: 20px;
            margin: 20px 0;
            color: var(--text-light);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 12px;
            text-align: left;
        }

        th {
            background: var(--bg-alt);
        }

        footer {
            border-top: 1px solid var(--border);
            padding: 40px 0;
            margin-top: 60px;
            color: var(--text-light);
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
            }

            .container {
                padding: 0 15px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a href="/" class="logo">AI Tools Daily</a>
            <nav>
                <a href="/reviews/">Reviews</a>
                <a href="/tutorials/">Tutorials</a>
                <a href="/compare/">Comparisons</a>
                <a href="/categories/">Categories</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {{ block "main" . }}{{ end }}
    </main>

    <footer>
        <div class="container">
            <p>&copy; {{ now.Year }} AI Tools Daily. All rights reserved.</p>
            <p style="margin-top: 10px;">
                <a href="/privacy/">Privacy</a> &middot;
                <a href="/about/">About</a> &middot;
                <a href="/contact/">Contact</a>
            </p>
        </div>
    </footer>
</body>
</html>
