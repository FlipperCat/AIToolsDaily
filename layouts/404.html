{{ define "main" }}
<section class="error-page" style="padding:calc(var(--header-height) + var(--space-16)) 0 var(--space-16);min-height:60vh;display:flex;align-items:center;">
    <div class="container">
        <div style="max-width:600px;margin:0 auto;text-align:center;">
            <!-- 404 Visual -->
            <div style="margin-bottom:var(--space-8);">
                <span style="font-family:var(--font-display);font-size:clamp(6rem,15vw,10rem);font-weight:800;background:var(--gradient-primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;">404</span>
            </div>

            <h1 style="font-size:var(--text-2xl);margin-bottom:var(--space-4);">Page Not Found</h1>
            <p style="color:var(--color-text-secondary);font-size:var(--text-lg);margin-bottom:var(--space-8);">
                The page you're looking for doesn't exist or has been moved. Let's get you back on track.
            </p>

            <!-- Quick Actions -->
            <div style="display:flex;gap:var(--space-4);justify-content:center;flex-wrap:wrap;margin-bottom:var(--space-12);">
                <a href="/" class="btn btn-primary btn-lg">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    Go Home
                </a>
                <a href="/tools/" class="btn btn-secondary btn-lg">Browse AI Tools</a>
            </div>

            <!-- Popular Pages -->
            <div style="background:var(--color-bg-alt);border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:var(--space-8);text-align:left;">
                <h3 style="font-size:var(--text-lg);margin-bottom:var(--space-6);text-align:center;">Popular Pages</h3>
                <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-4);">
                    <a href="/tools/" style="display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3);background:var(--color-bg);border-radius:var(--radius-md);text-decoration:none;color:var(--color-text);transition:all var(--transition-fast);">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="2">
                            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                        </svg>
                        <span>AI Tools Directory</span>
                    </a>
                    <a href="/reviews/" style="display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3);background:var(--color-bg);border-radius:var(--radius-md);text-decoration:none;color:var(--color-text);transition:all var(--transition-fast);">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="2">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
                        </svg>
                        <span>Tool Reviews</span>
                    </a>
                    <a href="/tutorials/" style="display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3);background:var(--color-bg);border-radius:var(--radius-md);text-decoration:none;color:var(--color-text);transition:all var(--transition-fast);">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="2">
                            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                        </svg>
                        <span>Tutorials</span>
                    </a>
                    <a href="/comparisons/" style="display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3);background:var(--color-bg);border-radius:var(--radius-md);text-decoration:none;color:var(--color-text);transition:all var(--transition-fast);">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="2">
                            <line x1="18" y1="20" x2="18" y2="10"></line>
                            <line x1="12" y1="20" x2="12" y2="4"></line>
                            <line x1="6" y1="20" x2="6" y2="14"></line>
                        </svg>
                        <span>Comparisons</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
{{ end }}
