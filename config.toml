baseURL = "https://aitoolsdaily.org/"
languageCode = "en-us"
title = "AI Tools Daily - Automate Your Work with AI"

[params]
  description = "Discover the best AI tools for automation, productivity, and getting more done. Reviews, tutorials, and comparisons."
  author = "AI Tools Daily"

  # Analytics - Add your Google Analytics ID here
  # googleAnalytics = "G-XXXXXXXXXX"

  # Social links
  twitter = "https://twitter.com/aitoolsdaily"

  # Default OG image for social sharing
  ogImage = "/images/og-default.png"

[taxonomies]
  tag = "tags"
  category = "categories"

[permalinks]
  posts = "/:slug/"
  reviews = "/reviews/:slug/"
  tutorials = "/tutorials/:slug/"
  comparisons = "/compare/:slug/"
  tools = "/tools/:slug/"
  news = "/news/:slug/"
  case-studies = "/case-studies/:slug/"
  industry = "/industry/:slug/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[outputFormats]
  [outputFormats.JSON]
    mediaType = "application/json"
    baseName = "index"

[sitemap]
  changefreq = "weekly"
  priority = 0.5

[related]
  includeNewer = true
  threshold = 80
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 80
  [[related.indices]]
    name = "date"
    weight = 10
